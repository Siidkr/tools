<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Valentine Scrapbook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Patrick+Hand&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              hand: ['"Indie Flower"', 'cursive'],
              marker: ['"Patrick Hand"', 'cursive'],
              caveat: ['"Caveat"', 'cursive'],
            },
            boxShadow: {
              'book': '0 20px 40px -5px rgba(0, 0, 0, 0.4)',
              'paper': '1px 1px 3px rgba(0,0,0,0.1)',
              'glow': '0 0 15px rgba(251, 113, 133, 0.6)',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-6px)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'rotate(-3deg)' },
                '50%': { transform: 'rotate(3deg)' },
              },
              sway: {
                '0%, 100%': { transform: 'rotate(-6deg)' },
                '50%': { transform: 'rotate(6deg)' },
              },
              twinkle: {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.4', transform: 'scale(0.8)' },
              },
              bloom: {
                '0%': { opacity: '0', transform: 'scale(0) translateY(20px)' },
                '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              },
              'float-slow': {
                 '0%': { transform: 'translateY(-10vh) rotate(0deg)', opacity: '0' },
                 '10%': { opacity: '0.8' },
                 '100%': { transform: 'translateY(100vh) rotate(360deg)', opacity: '0' }
              },
              'float-up': {
                 '0%': { transform: 'translateY(110vh) scale(0.8)', opacity: '0' },
                 '10%': { opacity: '0.6' },
                 '90%': { opacity: '0.6' },
                 '100%': { transform: 'translateY(-10vh) scale(1.2)', opacity: '0' }
              },
              'shooting-star': {
                '0%': { transform: 'translateX(0) translateY(0) rotate(315deg)', opacity: '1' },
                '100%': { transform: 'translateX(-300px) translateY(300px) rotate(315deg)', opacity: '0' }
              },
              slideDown: {
                '0%': { transform: 'translateY(-100%) translateX(-50%)', opacity: '0' },
                '100%': { transform: 'translateY(0) translateX(-50%)', opacity: '1' }
              },
              zoomIn: {
                '0%': { transform: 'translate(-50%, 0) scale(0.95)', opacity: '0' },
                '100%': { transform: 'translate(-50%, 0) scale(1)', opacity: '1' }
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' }
              }
            },
            animation: {
              float: 'float 3s ease-in-out infinite',
              wiggle: 'wiggle 2s ease-in-out infinite',
              sway: 'sway 4s ease-in-out infinite',
              twinkle: 'twinkle 3s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
              bloom: 'bloom 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
              'float-slow': 'float-slow 15s linear infinite',
              'float-up': 'float-up 15s linear infinite',
              'shooting-star': 'shooting-star 3s ease-out infinite',
              'slide-down': 'slideDown 0.7s ease-out forwards',
              'zoom-in': 'zoomIn 0.5s ease-out forwards',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #fff1f2; /* Rose 50 */
        /* Smooth Gradient Mesh */
        background-image: radial-gradient(at 0% 0%, hsla(350,90%,96%,1) 0, transparent 50%), 
                          radial-gradient(at 50% 0%, hsla(330,90%,96%,1) 0, transparent 50%), 
                          radial-gradient(at 100% 0%, hsla(350,90%,96%,1) 0, transparent 50%);
        overflow: hidden; 
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%23ec4899" stroke="white" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'), auto;
      }
      .perspective-2000 {
        perspective: 2000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      button, a, input, [role="button"] {
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%23be123c" stroke="white" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'), pointer;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
